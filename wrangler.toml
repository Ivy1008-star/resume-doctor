name = "resume-doctor"
compatibility_date = "2025-07-28"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Non-secret runtime config lives here (version-controlled) because the
# Cloudflare API token used for deploys can only write *secret* env vars to the
# dashboard, not plain-text ones. Secrets (DEEPSEEK_API_KEY,
# PAYPAL_CLIENT_SECRET, SESSION_SECRET) stay in the Pages dashboard and must NOT
# be duplicated here, or the deploy fails with "Binding name '...' already in
# use". The dashboard production config has no plain-text vars, so this block is
# conflict-free.
[vars]
DEEPSEEK_BASE = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-v4-flash"
NEXT_PUBLIC_GOOGLE_CLIENT_ID = "1011816257095-ibknprbj6jj5cgip8mg0s1gh0ffkhkvo.apps.googleusercontent.com"
NEXT_PUBLIC_PAYPAL_CLIENT_ID = "AfeGXTOmrgwVVkvWgGXKoUK5rP5DOHJhG7xdhHgU8HdBNZ5OhXo76gtRD95KfI01Xnm2nj8NtfMtlTkR"
PAYPAL_ENV = "live"
PAYPAL_PLAN_ID = "P-6PM07268F3963680ENJVB5JY"
PRICE_REWRITE = "5"
PRICE_PREMIUM = "10"
PRICE_MONTHLY = "12"
DAILY_ANALYSIS_LIMIT = "3"
DAILY_ANALYSIS_LIMIT_PRO = "30"
NEXT_TELEMETRY_DISABLED = "1"

# The D1 binding is only defined here (the dashboard has none), so it must stay
# or the Worker falls back to the Node-only local store and fails at runtime
# with 'No such module local-store.js'.
[[d1_databases]]
binding = "resume_doctor_db"
database_name = "resume-doctor-db"
database_id = "d86ead03-3f5b-4ed5-b1f0-3fb5fa968d20"
