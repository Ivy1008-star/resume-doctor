name = "resume-doctor"
compatibility_date = "2025-07-28"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Environment variables, secrets, and the D1 binding (resume_doctor_db) are
# configured in the Cloudflare Pages dashboard (Production). They are NOT
# duplicated here: declaring them in both places makes the deploy fail with
# "Binding name '...' already in use". The dashboard is the source of truth
# because it also holds secrets (DEEPSEEK_API_KEY, PAYPAL_CLIENT_SECRET) that
# must not live in the repo.
